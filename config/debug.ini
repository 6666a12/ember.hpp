# 诊断配置：example.ini 的副本 + debug 开关
# 用法：build/example_basic.exe config/debug.ini
# 每 6 帧输出一行 alive/spawns/mask 诊断到 stderr。
[system]
gravity        = 0, -7, 0
drag           = 0.05
wind           = 0, 0, 0
turbulence     = 0.4
blend          = additive
capacity       = 150000
max_spawn_per_frame = 40000
forces         = gravity, drag, wind, turbulence, attractors, vortex, noise_wind
drag_mode      = linear
noise_wind_direction = 0, 0, 1
noise_wind_amplitude = 2.5
noise_wind_scale     = 0.4
noise_wind_speed     = 0.8
size_scale       = 1.5
texture          = sprites/test.png
bloom            = false
debug            = true

[palette "fire"]
colors = 1, 0.95, 0.55, 1 | 1, 0.6, 0.15, 1 | 1, 0.18, 0.05, 1

[palette "ice"]
colors = 0.75, 0.95, 1, 0.9 | 0.4, 0.7, 1, 0.9 | 1, 1, 1, 0.8

[palette "aurora"]
colors = 0.2, 1, 0.6, 0.9 | 0.1, 0.8, 1, 0.9 | 0.6, 0.3, 1, 0.9 | 1, 0.4, 0.8, 0.9

[emitter "fountain"]
shape          = cone
position       = 0, 0, 0
axis           = 0, 1, 0
radius         = 0.25
rate           = 7000
base_velocity  = 0, 10, 0
speed_min      = 7
speed_max      = 11
spread         = 0.25
life_min       = 2
life_max       = 3.5
size_min       = 0.05
size_max       = 0.11
palette        = fire

[emitter "spark trail"]
shape          = sphere
radius         = 0.08
rate           = 400
speed_min      = 0.5
speed_max      = 2
spread         = 1
life_min       = 0.4
life_max       = 0.9
size_min       = 0.03
size_max       = 0.06
palette        = aurora

[attractor]
position = 0, 0.6, 0
strength = 60

[vortex]
position = 0, 3, 0
axis     = 0, 1, 0
strength = 8
radius   = 6
