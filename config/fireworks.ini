# ============================================================================
#  ember 烟花示例配置
#  按 R 键热重载（调色板/重力/湍流/力场开关等即时生效，下次爆点起用新配置）。
# ============================================================================

[system]
gravity        = 0, -4, 0
drag           = 0.06
wind           = 0, 0, 0
turbulence     = 0.15
blend          = additive
capacity       = 250000
max_spawn_per_frame = 32768
# 启用哪些力场（缺省 = 既有 5 种全开）。可用名：
#   gravity drag wind turbulence attractors vortex spring noise_wind wave boundary
forces         = gravity, drag, turbulence, boundary
# 地面边界：粒子低于 boundary_y 时按模式处理
#   kill（默认演示）— 烟花碎片落地即消失，不再穿过地面
#   bounce —— 反弹，restitution 为恢复系数（0~1，越大越弹）
boundary_mode  = kill
boundary_y     = 0.2
restitution    = 0.5

# 调色板：每次爆点随机选一个调色板、再从中随机取色
[palette "white"]
colors = 1, 1, 1, 1 | 0.95, 0.98, 1, 1 | 1, 0.9, 0.7, 1

[palette "red"]
colors = 1, 0.25, 0.2, 1 | 1, 0.6, 0.3, 1 | 1, 0.1, 0.05, 1

[palette "gold"]
colors = 1, 0.8, 0.3, 1 | 1, 0.95, 0.6, 1 | 1, 0.55, 0.1, 1

[palette "cyan"]
colors = 0.2, 0.85, 1, 1 | 0.6, 0.95, 1, 1 | 0.1, 0.6, 0.9, 1

[palette "violet"]
colors = 0.85, 0.35, 1, 1 | 0.6, 0.25, 0.95, 1 | 1, 0.7, 1, 1

[palette "green"]
colors = 0.3, 1, 0.5, 1 | 0.7, 1, 0.35, 1 | 0.1, 0.8, 0.4, 1
