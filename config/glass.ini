# ============================================================================
#  ember 玻璃渣示例配置（屏幕空间折射）
#  用法：build/example_glass [config/glass.ini]
#  碎片的折射精细参数由示例的预设（G 键切换 glass/heat/water/prism）控制，
#  这里只放物理/发射器/通用渲染键。
#  注意：注释必须独占一行（解析器不支持行尾注释）。
# ============================================================================

[system]
gravity        = 0, -9.8, 0
drag           = 0.02
turbulence     = 0
blend          = additive
capacity       = 200000
max_spawn_per_frame = 8000
forces         = gravity, drag, boundary
boundary_mode  = bounce
boundary_y     = 0
restitution    = 0.25
# 通用 billboard 自旋（弧度/秒，0 = 关）——碎片翻滚
spin           = 1.5
# 折射开/关 + 模式 + 强度（精细参数在示例的预设里）
refraction          = true
refraction_mode     = simple
refraction_strength = 0.02

[emitter "shards"]
shape          = sphere
position       = 0, 7, 0
radius         = 2.5
rate           = 500
speed_min      = 2
speed_max      = 6
spread         = 1
life_min       = 2
life_max       = 4
size_min       = 0.03
size_max       = 0.10
# 折射粒子（玻璃渣）
refractive     = true
color_min      = 1, 1, 1, 1
color_max      = 1, 1, 1, 1
