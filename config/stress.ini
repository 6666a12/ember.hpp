# ============================================================================
#  ember 压力测试配置（100 万粒子）
#  用法：build/example_basic.exe config/stress.ini
#  稳态 ~90 万活粒子（rate 300k/s × 平均寿命 3s）。
#  显存：两个 64MB 粒子缓冲 + 4MB 回收栈 + 4MB 排序索引 ≈ 130MB（另 + 排序关闭）
#  关闭 bloom/sort/soft，测纯仿真+渲染吞吐。
# ============================================================================

[system]
gravity        = 0, -7, 0
drag           = 0.02
wind           = 0, 0, 0
turbulence     = 0
blend          = additive
capacity       = 1000000
max_spawn_per_frame = 100000
forces         = gravity, drag
size_scale     = 1.0
streak         = 0
soft_particles = false
bloom          = false
sort           = false
editor         = false

[emitter "flood"]
shape          = sphere
position       = 0, 10, 0
radius         = 20
rate           = 300000
speed_min      = 2
speed_max      = 6
spread         = 1
life_min       = 2.5
life_max       = 3.5
size_min       = 0.04
size_max       = 0.10
color_min      = 1, 0.8, 0.4, 1
color_max      = 1, 0.3, 0.1, 1
